<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scientific calculator</title>
    <link rel="stylesheet" href="style5.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <input type="text" 
        class="display" id="display" placeholder="0" disabled>
       <div class="buttons">
         <button class="btn">1</button>
         <button class="btn">2</button>
         <button class="btn">3</button>
         <button class="btn">4</button>
         <button class="btn">5</button>
         <button class="btn">6</button>
         <button class="btn">7</button>
         <button class="btn">8</button>
         <button class="btn">9</button>
         <button class="btn">0</button>
         <button class="btn clear"><i class="fa-solid fa-c"></i></button>
         <button class="btn clear"><i class="fa-solid fa-delete-left"></i></button>
         <button class="btn operator"><i class="fa-solid fa-xmark"></i></button>
         <button class="btn operator"><i class="fa-solid fa-plus"></i></button>
         <button class="btn operator"><i class="fa-solid fa-minus"></i></button>
         <button class="btn operator"><i class="fa-solid fa-divide"></i></button>
         <button class="btn operator"><i class="fa-solid fa-exclamation"></i></button>
         <button class="btn symbol">.</button>
         <button class="btn symbol">,</button>
         <button class="btn operator"><i class="fa-solid fa-percent"></i></button>
         <button class="btn operator">cos(</button>
         <button class="btn operator">sin(</button>
         <button class="btn operator">tan(</button>
         <button class="btn operator">e</button>
         <button class="btn operator">pi</button>
         <button class="btn operator">^</button>
         <button class="btn symbol">(</button>
         <button class="btn symbol">)</button>
         <button class="btn operator">log(</button>
         <button class="btn operator">sqrt(</button>
         <button class="btn operator">log2(</button>
         <button class="btn operator">log10(</button>
         <button class="btn operator">l2e</button>
         <button class="btn operator">l10e</button>
         <button class="btn operator">exp(</button>
         <button class="btn equal"><i class="fa-solid fa-equals"></i></button>
         
         </div> 
        </div>
    <script src="script5.js"></script>
</body>
</html>
