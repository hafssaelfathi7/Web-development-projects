<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style4.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
    <input type="text" id="display" class="display" disabled>
    <div class="buttons">
     <button class="btn clear" onclick="clearDisplay()">C</button>
     <button class="btn operator" onclick="appendOperation('/')"><i class="fa-solid fa-divide"></i></button>
     <button class="btn operator" onclick="appendOperation('*')"><i class="fa-solid fa-xmark"></i></button>
     <button class="btn operator" onclick="appendOperation('-')"><i class="fa-solid fa-minus"></i></button>
      <br> 

     <button class="btn"  onclick="appendNumber('7')">7</button>
     <button class="btn" onclick="appendNumber('8')">8</button>
     <button class="btn" onclick="appendNumber('9')">9</button>
     <button class="btn operator" onclick="appendOperation('+')" ><i class="fa-solid fa-plus"></i></button>
     <br>
     <button class="btn" onclick="appendNumber('4')">4</button>
      <button class="btn" onclick="appendNumber('5')">5</button>
     <button class="btn" onclick="appendNumber('6')">6</button>
     <button class="btn equal" onclick="calculate()">=</button>
     <br>
     <button class="btn" onclick="appendNumber('1')">1</button>
     <button class="btn" onclick="appendNumber('2')">2</button>
     <button class="btn" onclick="appendNumber('3')">3</button>
     <button class="btn" onclick="appendNumber('0')">0</button>
     <br>    

 <script  src="script4.js"></script>
</body>
</html>
