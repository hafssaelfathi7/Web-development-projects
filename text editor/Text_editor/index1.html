<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href=
  "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css">  <!--to link font awesome and to use icons code -->
    <title>Text Editor </title>
</head>
    
<body>
  <section class="buttons">
    <h1>Text Editor </h1>
     <div class="button-container">
        <button onclick="editoroption1()"title="Bold text">bold</button>
        <button onclick="editoroption2()" title="italic text">italic</button>
        <button onclick="editoroption3()" title="left align"><i class="fas  fa-align-center"></i> </button>
        <button onclick="editoroption4()" title="center align"><i class="fas  fa-align-center"></i> </button>
        <button onclick="editoroption5()" title="right align"><i class="fas  fa-align-right"></i> </button>
        <button onclick="editoroption6()" title="uppercase">uppercase</button>
        <button onclick="editoroption7()" title="lowercase">lowercase</button>
        <button onclick="editoroption8()" title="capitalize">capitalize</button>
        <button onclick="editoroption9()" title="clear text">clear text</button>
      </div>
    
        <textarea  id="textarea1" placeholder="Type your text here..." rows="15"></textarea>
    </section>

    <script src="script1.js"></script>
    
</body>
</html>
